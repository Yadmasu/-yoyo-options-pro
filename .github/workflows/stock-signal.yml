name: YOYO Stock Signal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stock-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run stock signal
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python3 stock_signal.py

      - name: Upload signal result
        uses: actions/upload-artifact@v4
        with:
          name: yoyo-stock-signal
          path: stock_signal.json
          if-no-files-found: error

      - name: Publish signal to website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock_signal.json
          if ! git diff --cached --quiet; then
            git commit -m "Update stock signal"
            git push
          fi
